name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build archive
        run: |
          xcodebuild \
            -project OfflineSnake.xcodeproj \
            -scheme OfflineSnake \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            -archivePath build/OfflineSnake.xcarchive \
            archive

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/OfflineSnake.xcarchive/Products/Applications/OfflineSnake.app Payload/
          zip -r -X OfflineSnake.ipa Payload
          ls -lh OfflineSnake.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OfflineSnake-ipa
          path: OfflineSnake.ipa
          retention-days: 7
